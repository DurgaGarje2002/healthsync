<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Emergency Card - HealthSync</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Inter', sans-serif;
        }

        .card-container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .title {
            font-weight: 700;
            margin-bottom: 25px;
        }

        .btn-save {
            background: #43A047;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
        }

        .btn-save:hover {
            background: #2E7D32;
        }
    </style>
</head>
<body>

<div class="card-container">

    <h3 class="title">🚑 Emergency Card Information</h3>

    <form id="cardForm">

        <div class="mb-3">
            <label class="form-label">Medical History</label>
            <textarea class="form-control" id="medicalHistory"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Current Disease</label>
            <input type="text" class="form-control" id="currentDisease">
        </div>

        <div class="mb-3">
            <label class="form-label">Medications (comma separated)</label>
            <input type="text" class="form-control" id="medications">
        </div>

        <div class="mb-3">
            <label class="form-label">Allergies</label>
            <input type="text" class="form-control" id="allergies">
        </div>

        <div class="mb-3">
            <label class="form-label">Emergency Contact</label>
            <input type="text" class="form-control" id="emergencyContact" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Hospital Name</label>
            <input type="text" class="form-control" id="hospitalName">
        </div>

        <div class="mb-3">
            <label class="form-label">Hospital Address</label>
            <input type="text" class="form-control" id="hospitalAddress">
        </div>

        <div class="mb-4">
            <label class="form-label">Google Map Link</label>
            <input type="text" class="form-control" id="hospitalMapLink">
        </div>

        <button type="submit" class="btn btn-save text-white">
            Save Emergency Card
        </button>

    </form>

</div>

<script>

const token = localStorage.getItem('token') || sessionStorage.getItem('token');
const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId');

if (!token || !userId) {
    window.location.href = '/login';
}

// 🔹 Load existing card
async function loadCard() {

    const response = await fetch(`/api/patient-card/user/${userId}`, {
        headers: {
            'Authorization': 'Bearer ' + token
        }
    });

    if (response.status === 200) {
        const data = await response.json();

        document.getElementById("medicalHistory").value = data.medicalHistory || '';
        document.getElementById("currentDisease").value = data.currentDisease || '';
        document.getElementById("medications").value = data.medications || '';
        document.getElementById("allergies").value = data.allergies || '';
        document.getElementById("emergencyContact").value = data.emergencyContact || '';
        document.getElementById("hospitalName").value = data.hospitalName || '';
        document.getElementById("hospitalAddress").value = data.hospitalAddress || '';
        document.getElementById("hospitalMapLink").value = data.hospitalMapLink || '';
    }
}

// 🔹 Save card
document.getElementById("cardForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const cardData = {
        medicalHistory: document.getElementById("medicalHistory").value,
        currentDisease: document.getElementById("currentDisease").value,
        medications: document.getElementById("medications").value,
        allergies: document.getElementById("allergies").value,
        emergencyContact: document.getElementById("emergencyContact").value,
        hospitalName: document.getElementById("hospitalName").value,
        hospitalAddress: document.getElementById("hospitalAddress").value,
        hospitalMapLink: document.getElementById("hospitalMapLink").value
    };

    const response = await fetch(`/api/patient-card/user/${userId}`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify(cardData)
    });

    if (response.ok) {
        alert("Emergency Card Saved Successfully!");
    } else {
        alert("Error saving card.");
    }
});

loadCard();

</script>

</body>
</html>
